[workspace]
resolver = "3"
# Явный список вместо glob `crates/*`: glob ломает загрузку workspace,
# если в crates/ появляется каталог без Cargo.toml.
members = [
    "crates/config",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/engine",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Источник для Check for Updates (owner/repo берётся отсюда).
repository = "https://github.com/underherzen/crabtrap"

[workspace.dependencies]
# Внутренние крейты
domain = { path = "crates/domain" }
application = { path = "crates/application" }
engine = { path = "crates/engine" }
infrastructure = { path = "crates/infrastructure" }
config = { path = "crates/config" }

# Общие
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
url = "2.5"
regex = "1.11"
bytes = "1.11"
futures = "0.3"
# ReaderStream: потоковая отдача файлов Map Local.
tokio-util = { version = "0.7", features = ["io"] }
base64 = "0.22"
percent-encoding = "2.3"
hex = "0.4"
toml = "0.9"
# Точечная правка config.toml (комментарии и чужие ключи сохраняются).
toml_edit = "0.25"

# Runtime / сеть
# process — osascript/security в certificate_service; fs — чтение ca.pem движком.
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros", "signal", "process", "fs"] }
async-channel = "2.5"
http = "1.3"
http-body-util = "0.1"
# http2 (Phase 11): MITM-сервер h1/h2 по ALPN (server-auto), upstream-клиент h2.
hyper = { version = "1.8", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server", "server-auto", "client", "client-legacy"] }
# tower-трейт Service<Uri> для кастомного HttpsConnector (hyper-util legacy-клиент
# требует именно его; hyper::service::Service — собственный упрощённый трейт).
tower-service = "0.3"

# TLS / сертификаты
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
# x509-parser-фича rcgen нужна для Issuer::from_ca_cert_pem (переиспользование
# персистентного CA без хранения исходных CertificateParams).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = "0.17"
sha2 = "0.10"
time = "0.3"

# Хранение / инфраструктура
directories = "6.0"
lru = "0.18"
tempfile = "3.27"
async-compression = { version = "0.4", features = ["gzip", "brotli", "deflate", "tokio"] }
# LAN-IP для QR экрана сертификатов (Phase 4).
local-ip-address = "0.6"
# Инспектор (Phase 5): flate2 rust_backend (без C) + brotli — чистый Rust,
# синхронная декомпрессия в BodyDecoderService; image — превью картинок;
# encoding_rs — charset (windows-1251 и пр.).
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
brotli = "8"
# zstd (Chrome шлёт Accept-Encoding: zstd) — чистый Rust, без C.
ruzstd = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
encoding_rs = "0.8"
# Случайный обрыв запросов throttle (потери); уже в дереве зависимостей.
fastrand = "2"
# CSPRNG для ключа маски WebSocket-кадра (RFC 6455 §5.3); уже в дереве через rustls.
ring = "0.17"
# Скрипты (Track S): JS-движок на чистом Rust (без C) — как и остальной
# стек; контексты !Send, живут в пуле выделенных потоков.
boa_engine = "0.22"

# UI (зонт-крейт: включает GPUI (gpui-pre), компоненты, ассеты)
# Подсветка JS (редактор скриптов) и JSON (консоль; грамматика входит в базовый tree-sitter) —
# C-код, но только в UI; движок и скрипты остаются на чистом Rust.
gpui-kit = { version = "0.6", features = ["tree-sitter-javascript"] }
# Иконка в строке меню macOS (как у Charles): NSStatusItem + меню (muda).
# default-features выключены — они тянут libappindicator/GTK (Linux).
tray-icon = { version = "0.26", default-features = false }
# QR-код экрана сертификатов (Phase 4): модули рисуем div-гридом сам.
qrcode = "0.14"
# Клиент обмена (Track G8): proc_pidpath (libproc) и иконки приложений
# через NSWorkspace. Версии — те же, что уже тянет tray-icon.
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext"] }

# Оптимизация зависимостей в dev-сборке (рекомендация gpui-kit: рендер-крейты тяжёлые в debug)
[profile.dev.package."*"]
opt-level = 3

# Сборка для релиза (scripts/bundle-macos.sh): thin LTO — почти весь выигрыш
# fat LTO при разумном времени линковки; символы снимает strip.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
