<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A55"/>
      <stop offset="1" stop-color="#121A2B"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#E5482E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Плитка по сетке иконок macOS: 824×824 с отступом 100 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <!-- Сетка-ловушка -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="6">
    <path d="M100 330 H924 M100 512 H924 M100 694 H924"/>
    <path d="M330 100 V924 M512 100 V924 M694 100 V924"/>
  </g>

  <g filter="url(#shadow)">
    <!-- Ноги -->
    <g stroke="#E5482E" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M380 600 L290 650 L250 730"/>
      <path d="M375 650 L300 720 L285 800"/>
      <path d="M644 600 L734 650 L774 730"/>
      <path d="M649 650 L724 720 L739 800"/>
    </g>
    <!-- Руки к клешням -->
    <g stroke="#FF7A4D" stroke-width="30" stroke-linecap="round" fill="none">
      <path d="M400 520 L320 440 L300 380"/>
      <path d="M624 520 L704 440 L724 380"/>
    </g>
    <!-- Клешни -->
    <path d="M300 395 C215 395 200 290 250 240 C265 300 300 315 335 300 C350 255 330 225 300 210 C370 205 410 260 400 320 C392 370 350 395 300 395 Z" fill="url(#shell)"/>
    <path d="M724 395 C809 395 824 290 774 240 C759 300 724 315 689 300 C674 255 694 225 724 210 C654 205 614 260 624 320 C632 370 674 395 724 395 Z" fill="url(#shell)"/>
    <!-- Панцирь -->
    <ellipse cx="512" cy="590" rx="170" ry="120" fill="url(#shell)"/>
    <!-- Глаза -->
    <g stroke="#FF7A4D" stroke-width="16" stroke-linecap="round">
      <path d="M465 480 L455 430"/>
      <path d="M559 480 L569 430"/>
    </g>
    <circle cx="453" cy="420" r="26" fill="#FFFFFF"/>
    <circle cx="571" cy="420" r="26" fill="#FFFFFF"/>
    <circle cx="457" cy="424" r="12" fill="#121A2B"/>
    <circle cx="567" cy="424" r="12" fill="#121A2B"/>
  </g>
</svg>
