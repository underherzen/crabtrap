# Тег vX.Y.Z → universal .dmg → черновик релиза на GitHub.
# Публикация черновика (вручную) запускает homebrew.yml.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches Cargo version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="app") | .version')"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - run: rustup show && rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Developer ID — только если секреты заданы; иначе ad-hoc подпись.
      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >>"$GITHUB_ENV"
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            echo "$APPLE_API_KEY_P8" >"$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >>"$GITHUB_ENV"
          fi

      - name: Build, sign, package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/bundle-macos.sh --universal

      - name: Release notes from CHANGELOG
        run: |
          scripts/changelog-section.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
          if [[ -z "${MACOS_SIGN_IDENTITY:-}" ]]; then
            cat >>"$RUNNER_TEMP/notes.md" <<'NOTE'

          ---
          **Not notarized.** On first launch macOS blocks the app: open
          System Settings → Privacy & Security → *Open Anyway*, or run
          `xattr -dr com.apple.quarantine /Applications/crabtrap.app`.
          Homebrew installs (`brew install --cask underherzen/tap/crabtrap`) do this for you.
          NOTE
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "crabtrap $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.dmg dist/*.dmg.sha256
